Name: harbour-rootreasury
Summary: Personal finance manager for SailfishOS
Version: 1.5
Release: 1
Group: Qt/Qt
URL: https://github.com/RootGPT-YouTube
License: GPL-3.0-or-later
Sources:
- '%{name}-%{version}.tar.bz2'
Description: |
  RooTreasury is a personal finance manager for SailfishOS.
Configure: none
Builder: qtc5

PkgConfigBR:
  - sailfishapp >= 1.0.2
  - Qt5Core
  - Qt5Qml
  - Qt5Quick

Requires:
  - sailfishsilica-qt5 >= 0.10.9

Files:
  - '%{_bindir}/RooTreasury'
  - '%{_datadir}/RooTreasury'
  - '%{_datadir}/applications/RooTreasury.desktop'
  - '%{_datadir}/icons/hicolor/86x86/apps/RooTreasury.png'
  - '%{_datadir}/icons/hicolor/108x108/apps/RooTreasury.png'
  - '%{_datadir}/icons/hicolor/128x128/apps/RooTreasury.png'
  - '%{_datadir}/icons/hicolor/172x172/apps/RooTreasury.png'
  - '%{_datadir}/icons/hicolor/256x256/apps/RooTreasury.png'
